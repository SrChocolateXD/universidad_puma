<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universidad Puma</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    

    </head>

    <body>

        <main class="container d-flex align-items-center justify-content-center min-vh-100">

            <div class="card principal shadow-lg">

                <div class="card-body p-5">

                    <div class="text-center">

                        <i class="bi bi-mortarboard-fill logo"></i>

                        <h1 class="titulo">
                            Universidad Puma
                        </h1>

                        <p class="subtitulo">
                            Plataforma Académica basada en servicios
                        </p>

                    </div>

                    <div class="row mt-5 g-4">

                        <div class="col-md-6">

                            <div class="card modulo estudiantes">

                                <div class="card-body text-center">

                                    <i class="bi bi-people-fill icono"></i>

                                    <h3>Estudiantes</h3>

                                    <p>
                                        Gestión completa de estudiantes.
                                    </p>

                                    <a
                                        href="http://localhost:3001"
                                        class="btn btn-primary w-100">

                                        Ingresar

                                    </a>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-6">

                            <div class="card modulo cursos">

                                <div class="card-body text-center">

                                    <i class="bi bi-book-half icono"></i>

                                    <h3>Cursos</h3>

                                    <p>
                                        Gestión completa de cursos.
                                    </p>

                                    <a
                                        href="http://localhost:3002"
                                        class="btn btn-success w-100">

                                        Ingresar

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </body>

    </html>
