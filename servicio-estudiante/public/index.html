<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-mortarboard-fill"></i>
                Universidad Puma
            </span>
        </div>
    </nav>

    <main class="container my-4">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-10 col-xl-9">

                <div class="card shadow-lg mb-4">

                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="fs-4 fs-md-3 mb-0">
                            <i class="bi bi-person-plus-fill"></i>
                            Registro de Estudiantes
                        </h2>
                    </div>

                    <div class="card-body">

                        <form id="formulario">

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="codigo" class="form-label">Código</label>
                                    <input type="text" class="form-control" id="codigo" placeholder="Ej. E001" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="carrera" class="form-label">Carrera</label>
                                    <input type="text" class="form-control" id="carrera" placeholder="Ingeniería de Sistemas" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="nombres" class="form-label">Nombres</label>
                                    <input type="text" class="form-control" id="nombres" placeholder="Ingrese nombres" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" placeholder="Ingrese apellidos" required>
                                </div>

                                <div class="col-12 mb-3">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="correo" placeholder="correo@correo.com" required>
                                </div>

                            </div>

                            <div class="d-grid d-md-flex justify-content-md-end">
                                <button class="btn btn-success btn-lg" type="submit">
                                    <i class="bi bi-save-fill"></i>
                                    Registrar
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

                <div class="card shadow">

                    <div class="card-header bg-dark text-white">
                        <h4 class="fs-5 mb-0">
                            <i class="bi bi-people-fill"></i>
                            Lista de Estudiantes
                        </h4>
                    </div>

                    <div class="card-body">
                        <div id="mensaje" class="mb-3"></div>

                        <div class="row mb-3">
                            <div class="col-12 col-md-8 mb-2">
                                <input 
                                    type="text" 
                                    id="buscar" 
                                    class="form-control" 
                                    placeholder="Buscar estudiante por código, nombre, apellido o carrera">
                            </div>

                            <div class="col-12 col-md-4 text-md-end">
                                <span class="badge bg-primary fs-6">
                                    Total estudiantes: <span id="totalEstudiantes">0</span>
                                </span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover table-striped align-middle text-nowrap">
                                <thead class="table-primary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Código</th>
                                        <th>Nombres</th>
                                        <th>Apellidos</th>
                                        <th>Correo</th>
                                        <th>Carrera</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody id="listaEstudiantes">
                                    <!-- Aquí aparecerán los estudiantes -->
                                </tbody>
                            </table>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="bg-primary text-white text-center py-3 mt-4">
        <p class="mb-0">PA3 - Servicio de Estudiantes</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
